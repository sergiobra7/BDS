<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BİR.DUVARSESİ V10 — Clean Rebuild</title><style>body{font:16px system-ui;background:#111318;color:#f4f4f4;max-width:760px;margin:auto;padding:18px}h1{font-size:26px}label{display:block;margin:14px 0 5px}input,textarea,select,button{box-sizing:border-box;width:100%;background:#242832;color:white;border:1px solid #555;border-radius:8px;padding:12px;font:inherit}textarea{min-height:110px}button{background:#b72b30;font-weight:700;margin-top:16px}section{border:1px solid #363b46;padding:16px;border-radius:12px;margin:16px 0}small{color:#bcbcbc}pre{white-space:pre-wrap;overflow-wrap:anywhere} .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} .row>*{min-width:0}</style></head><body><h1>BİR.DUVARSESİ V10</h1><small>CLEAN REBUILD · Entwicklungsprototyp · keine Legacy-Prompt-Wrapper</small><section><h2>Szene & Kamera</h2><label>Szene</label><select id="scene"></select><label>Fassade</label><select id="facade"><option>Schwarzer Backstein</option><option>Schwarzer Industriebeton</option><option>Schwarzer Naturstein</option></select><label>Tageszeit</label><select id="time"><option>Nacht</option><option>Dämmerung</option><option>Tag</option></select><label>Kameraperspektive</label><select id="perspective"><option>Low Angle</option><option>Eye Level</option><option>High Angle</option></select><label>Hauptfigur Pose</label><select id="mainPose"></select><label>Mantelmann Pose</label><select id="n1Pose"></select><div class="row"><div><label>Brennweite mm</label><input id="lens" type="number" value="35"></div><div><label>Distanz m</label><input id="distance" type="number" value="45"></div></div><label>Format</label><select id="format"><option>9:16</option><option>4:5</option></select></section><section><h2>Wandtext</h2><label><input type="checkbox" id="wallOn" checked style="width:auto"> Wand aktiv</label><label>Schriftdominanz (%)</label><input id="dominance" type="number" min="1" max="100" value="90"><textarea id="wall" placeholder="Türkischen Wandtext eingeben"></textarea></section><section><h2>Figuren</h2><label><input type="checkbox" id="mix" style="width:auto"> Pose Mix aktiv</label><label>Hauptfigur Charakter</label><input id="mainName" value="Mann mit Zopf"><label>Mantelmann Charakter</label><input id="n1Name" value="Mantelmann"><label>Hauptfigur Position</label><input id="mainPosition" value="Linker Vordergrund"><label>Hauptfigur Körperausrichtung</label><select id="mainOrientation"><option>Automatisch</option><option>Frontal</option><option>Seitlich links</option><option>Seitlich rechts</option><option>Zur Wand</option></select><label>Mantelmann Position</label><input id="n1Position" value="Rechter Mittelgrund"><label>Mantelmann Körperausrichtung</label><select id="n1Orientation"><option>Automatisch</option><option>Frontal</option><option>Seitlich links</option><option>Seitlich rechts</option><option>Zur Wand</option></select><label>Hauptfigur Kleidung</label><input id="mainClothes" placeholder="Originalkleidung beibehalten"><label>Hauptfigur Geste</label><input id="mainGesture" placeholder="Keine zusätzliche Geste"><label>Mantelmann Kleidung</label><input id="n1Clothes" placeholder="Originalkleidung beibehalten"><label>Mantelmann Geste</label><input id="n1Gesture" placeholder="Keine zusätzliche Geste"><label>Hauptfigur Blick</label><select id="mainGaze"><option value="wall">Erstes Wort der Wand</option><option value="camera">Kamera</option><option value="street">Straße</option><option value="poster">Plakat</option><option value="auto">Automatisch</option></select><label><input type="checkbox" id="n1" style="width:auto" checked> Mantelmann aktiv</label><label>Mantelmann Blick</label><select id="n1Gaze"><option value="wall">Erstes Wort der Wand</option><option value="camera">Kamera</option><option value="main">Hauptfigur</option><option value="street">Straße</option></select></section><section><h2>Plakat</h2><label>Manuelle Wortfarben (JSON, z. B. {&quot;WORT&quot;:&quot;Gelb&quot;})</label><textarea id="posterColors" placeholder='{"WORT":"Gelb"}'></textarea><label>Plakatbesitzer</label><select id="posterOwner"><option value="main">Hauptfigur</option><option value="N1">Mantelmann</option></select><label><input type="checkbox" id="posterOn" style="width:auto"> Plakat aktiv</label><textarea id="posterText" placeholder="Plakattext"></textarea><label>Modus</label><select id="posterMode"><option>Freistehend</option><option>Gehalten</option></select><label>Hand</label><select id="posterHand"><option>Keine</option><option>Links</option><option>Rechts</option></select></section><button id="generate">Master-Prompt erstellen</button><button id="copy" style="background:#343b46">Prompt kopieren</button><section><h2>Ausgabe</h2><pre id="output"></pre></section><script src="catalog.js"></script><script src="core.js"></script><script>const $=id=>document.getElementById(id);for(const sc of BDS10_CATALOG.scenes){const o=document.createElement("option");o.value=sc.name;o.textContent=sc.id+" · "+sc.name+ (sc.city?" · "+sc.city:"");$("scene").append(o)}for(const id of ["mainPose","n1Pose"])for(const pose of BDS10_CATALOG.poses){const o=document.createElement("option");o.value=pose;o.textContent=pose;$(id).append(o)}const key="bds-v10-prototype";function snapshot(){return Object.fromEntries(["scene","mix","mainName","n1Name","mainClothes","mainGesture","n1Clothes","n1Gesture","posterColors","facade","time","perspective","wallOn","dominance","mainPosition","mainOrientation","n1Position","n1Orientation","posterOwner","mainPose","n1Pose","lens","distance","format","wall","mainGaze","n1","n1Gaze","posterOn","posterText","posterMode","posterHand"].map(k=>[k,$(k).type==="checkbox"?$(k).checked:$(k).value]));}try{const old=JSON.parse(localStorage.getItem(key)||"null");if(old)for(const [k,v] of Object.entries(old))if($(k)){$(k).type==="checkbox"?$(k).checked=v:$(k).value=v}}catch(e){}document.querySelectorAll("input,textarea,select").forEach(el=>el.addEventListener("change",()=>localStorage.setItem(key,JSON.stringify(snapshot()))));function syncPosterHand(){const mode=$("posterMode").value,hand=$("posterHand");for(const o of hand.options)o.disabled=mode==="Freistehend"?o.value!=="Keine":o.value==="Keine";if(mode==="Freistehend")hand.value="Keine";else if(hand.value==="Keine")hand.value="";}$("posterMode").addEventListener("change",()=>{syncPosterHand();localStorage.setItem(key,JSON.stringify(snapshot()))});syncPosterHand();$("generate").onclick=()=>{const x=structuredClone(BDS10.DEFAULTS);x.scene=$("scene").value;x.mix=$("mix").checked;x.figures[0].name=$("mainName").value;x.figures[0].clothing=$("mainClothes").value;x.figures[0].gesture=$("mainGesture").value;x.facade=$("facade").value;x.time=$("time").value;x.camera.perspective=$("perspective").value;x.wall.enabled=$("wallOn").checked;x.wall.dominance=Number($("dominance").value);x.figures[0].position=$("mainPosition").value;x.figures[0].orientation=$("mainOrientation").value;x.poster.owner=$("posterOwner").value;x.camera.lens=Number($("lens").value);x.camera.distance=Number($("distance").value);x.camera.format=$("format").value;x.wall.text=$("wall").value;x.figures[0].gaze=$("mainGaze").value;x.figures[0].pose=$("mainPose").value;if($("n1").checked)x.figures.push({id:"N1",name:$("n1Name").value,clothing:$("n1Clothes").value,gesture:$("n1Gesture").value,enabled:true,pose:$("n1Pose").value,position:$("n1Position").value,orientation:$("n1Orientation").value,gaze:$("n1Gaze").value});x.poster.enabled=$("posterOn").checked;x.poster.text=$("posterText").value;x.poster.mode=$("posterMode").value;x.poster.hand=$("posterHand").value;try{x.poster.colors=JSON.parse($("posterColors").value||"{}")}catch(e){$("output").textContent="FEHLER: Wortfarben müssen gültiges JSON sein.";return}const r=BDS10.generate(x);$("output").textContent=r.ok?r.prompt:"FEHLER:\n"+r.errors.join("\n");localStorage.setItem(key,JSON.stringify(snapshot()))};$("copy").onclick=()=>navigator.clipboard.writeText($("output").textContent);</script></body></html>

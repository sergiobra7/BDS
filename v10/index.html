<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BİR.DUVARSESİ V10 — Clean Rebuild</title><style>body{font:16px system-ui;background:#111318;color:#f4f4f4;max-width:760px;margin:auto;padding:18px}h1{font-size:26px}label{display:block;margin:14px 0 5px}input,textarea,select,button{box-sizing:border-box;width:100%;background:#242832;color:white;border:1px solid #555;border-radius:8px;padding:12px;font:inherit}textarea{min-height:110px}button{background:#b72b30;font-weight:700;margin-top:16px}section{border:1px solid #363b46;padding:16px;border-radius:12px;margin:16px 0}small{color:#bcbcbc}pre{white-space:pre-wrap;overflow-wrap:anywhere} .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} .row>*{min-width:0}</style></head><body><h1>BİR.DUVARSESİ V10</h1><small>CLEAN REBUILD · Entwicklungsprototyp · keine Legacy-Prompt-Wrapper</small><section><h2>Szene & Kamera</h2><label>Szene</label><input id="scene" value="Dachpromenade mit Hochhauswand und Skyline"><div class="row"><div><label>Brennweite mm</label><input id="lens" type="number" value="35"></div><div><label>Distanz m</label><input id="distance" type="number" value="45"></div></div><label>Format</label><select id="format"><option>9:16</option><option>4:5</option></select></section><section><h2>Wandtext</h2><textarea id="wall" placeholder="Türkischen Wandtext eingeben"></textarea></section><section><h2>Figuren</h2><label>Hauptfigur Blick</label><select id="mainGaze"><option value="wall">Erstes Wort der Wand</option><option value="camera">Kamera</option><option value="street">Straße</option><option value="poster">Plakat</option><option value="auto">Automatisch</option></select><label><input type="checkbox" id="n1" style="width:auto" checked> Mantelmann aktiv</label><label>Mantelmann Blick</label><select id="n1Gaze"><option value="wall">Erstes Wort der Wand</option><option value="camera">Kamera</option><option value="main">Hauptfigur</option><option value="street">Straße</option></select></section><section><h2>Plakat</h2><label><input type="checkbox" id="posterOn" style="width:auto"> Plakat aktiv</label><textarea id="posterText" placeholder="Plakattext"></textarea><label>Modus</label><select id="posterMode"><option>Freistehend</option><option>Gehalten</option></select><label>Hand</label><select id="posterHand"><option>Keine</option><option>Links</option><option>Rechts</option></select></section><button id="generate">Master-Prompt erstellen</button><button id="copy" style="background:#343b46">Prompt kopieren</button><section><h2>Ausgabe</h2><pre id="output"></pre></section><script src="core.js"></script><script>const $=id=>document.getElementById(id);const key="bds-v10-prototype";function snapshot(){return Object.fromEntries(["scene","lens","distance","format","wall","mainGaze","n1","n1Gaze","posterOn","posterText","posterMode","posterHand"].map(k=>[k,$(k).type==="checkbox"?$(k).checked:$(k).value]));}try{const old=JSON.parse(localStorage.getItem(key)||"null");if(old)for(const [k,v] of Object.entries(old))if($(k)){$(k).type==="checkbox"?$(k).checked=v:$(k).value=v}}catch(e){}document.querySelectorAll("input,textarea,select").forEach(el=>el.addEventListener("change",()=>localStorage.setItem(key,JSON.stringify(snapshot()))));$("generate").onclick=()=>{const x=structuredClone(BDS10.DEFAULTS);x.scene=$("scene").value;x.camera.lens=Number($("lens").value);x.camera.distance=Number($("distance").value);x.camera.format=$("format").value;x.wall.text=$("wall").value;x.figures[0].gaze=$("mainGaze").value;if($("n1").checked)x.figures.push({id:"N1",name:"Mantelmann",enabled:true,pose:"Ruhig stehend, Hände locker",position:"Mittelgrund",orientation:"Automatisch",gaze:$("n1Gaze").value});x.poster.enabled=$("posterOn").checked;x.poster.text=$("posterText").value;x.poster.mode=$("posterMode").value;x.poster.hand=$("posterHand").value;const r=BDS10.generate(x);$("output").textContent=r.ok?r.prompt:"FEHLER:\n"+r.errors.join("\n");localStorage.setItem(key,JSON.stringify(snapshot()))};$("copy").onclick=()=>navigator.clipboard.writeText($("output").textContent);</script></body></html>

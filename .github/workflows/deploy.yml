name: BDS ZIP Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest BDS ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'BDS*.zip' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$ZIP" || { echo "No BDS ZIP found"; exit 1; }
          mkdir -p _site
          unzip -q "$ZIP" -d _site
          test -f _site/index.html || { echo "index.html not found"; exit 1; }
      - name: Apply updated figure director from repository
        run: |
          test -f v9823.js
          cp v9823.js _site/v9823.js
          test -f v985.js
          cp v985.js _site/v985.js
          test -f v986.js
          cp v986.js _site/v986.js
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          cp sw.js _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
